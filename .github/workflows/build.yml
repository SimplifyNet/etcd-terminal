name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/EtcdTerminal.slnx

      - name: Build
        run: dotnet build src/EtcdTerminal.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test src/EtcdTerminal.slnx --configuration Release --no-build

      - name: Publish linux-x64
        run: |
          dotnet publish src/EtcdTerminal.App/ \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained \
            -p:PublishSingleFile=true \
            -o publish/linux-x64

      - name: Publish win-x64
        run: |
          dotnet publish src/EtcdTerminal.App/ \
            --configuration Release \
            --runtime win-x64 \
            --self-contained \
            -p:PublishSingleFile=true \
            -o publish/win-x64

      - name: Package linux-x64
        run: tar czf etcd-terminal-linux-x64.tar.gz -C publish/linux-x64 etcd-terminal

      - name: Package win-x64
        run: zip -j etcd-terminal-win-x64.zip publish/win-x64/etcd-terminal.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts
          path: |
            etcd-terminal-linux-x64.tar.gz
            etcd-terminal-win-x64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: artifacts

      - name: Extract changelog entry
        run: |
          awk '/^## \[/{if(f) exit; f=1; next} f' \
            src/EtcdTerminal.App/CHANGELOG.md \
            > /tmp/release_notes.md

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file /tmp/release_notes.md \
            etcd-terminal-linux-x64.tar.gz \
            etcd-terminal-win-x64.zip
