name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/EtcdTerminal.slnx

      - name: Build
        run: dotnet build src/EtcdTerminal.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test src/EtcdTerminal.slnx --configuration Release --no-build --filter "TestCategory != Integration"

      - name: Publish linux-x64
        run: |
          dotnet publish src/EtcdTerminal.App/ \
            --configuration Release \
            --runtime linux-x64 \
            -o publish/linux-x64

      - name: Publish win-x64
        run: |
          dotnet publish src/EtcdTerminal.App/ \
            --configuration Release \
            --runtime win-x64 \
            -o publish/win-x64

      - name: Publish linux-x64 self-contained
        run: |
          dotnet publish src/EtcdTerminal.App/ \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            -o publish/linux-x64-self-contained

      - name: Publish win-x64 self-contained
        run: |
          dotnet publish src/EtcdTerminal.App/ \
            --configuration Release \
            --runtime win-x64 \
            --self-contained true \
            -o publish/win-x64-self-contained

      - name: Package linux-x64
        run: tar czf etcd-terminal-linux-x64.tar.gz -C publish/linux-x64 .

      - name: Package win-x64
        run: cd publish/win-x64 && zip -r ../../etcd-terminal-win-x64.zip .

      - name: Package linux-x64 self-contained
        run: tar czf etcd-terminal-linux-x64-self-contained.tar.gz -C publish/linux-x64-self-contained .

      - name: Package win-x64 self-contained
        run: cd publish/win-x64-self-contained && zip -r ../../etcd-terminal-win-x64-self-contained.zip .

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts
          path: |
            etcd-terminal-linux-x64.tar.gz
            etcd-terminal-win-x64.zip
            etcd-terminal-linux-x64-self-contained.tar.gz
            etcd-terminal-win-x64-self-contained.zip

  arch:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: artifacts

      - name: Resolve package version
        id: version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/EtcdTerminal.App/EtcdTerminal.App.csproj)"
          fi
          if [[ ! "${version}" =~ ^[0-9][A-Za-z0-9._+]*$ ]]; then
            echo "Invalid package version: ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Build Arch package
        env:
          PKGVER: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          docker run --rm \
            -e PKGVER \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            archlinux:latest \
            bash -c '
              set -euo pipefail
              pacman -Sy --noconfirm archlinux-keyring >/dev/null
              pacman -Syu --noconfirm --needed base-devel >/dev/null
              useradd -m builder

              rm -rf /tmp/pkg
              mkdir -p /tmp/pkg
              cp -r /work/packaging/arch/. /tmp/pkg/
              cp /work/etcd-terminal-linux-x64-self-contained.tar.gz /tmp/pkg/

              sha256="$(sha256sum /tmp/pkg/etcd-terminal-linux-x64-self-contained.tar.gz)"
              sha256="${sha256%% *}"

              sed -i -e "s/^_tag=.*/_tag=${PKGVER}/" \
                     -e "s/^pkgver=.*/pkgver=${PKGVER}/" \
                     -e "s/^sha256sums=.*/sha256sums=(\"${sha256}\")/" /tmp/pkg/PKGBUILD
              chown -R builder:builder /tmp/pkg
              su - builder -c "cd /tmp/pkg && makepkg --nodeps --noconfirm --cleanbuild"

              cp /tmp/pkg/*.pkg.tar.zst /work/
            '

      - name: Upload Arch package
        uses: actions/upload-artifact@v7
        with:
          name: arch-package
          path: "*.pkg.tar.zst"

  debian:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: artifacts

      - name: Resolve package version
        id: version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/EtcdTerminal.App/EtcdTerminal.App.csproj)"
          fi
          if [[ ! "${version}" =~ ^[0-9][A-Za-z0-9._+]*$ ]]; then
            echo "Invalid package version: ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Install Debian build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential debhelper

      - name: Build .deb and source packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PPA_SERIES: ${{ vars.PPA_SERIES }}
        run: |
          set -euo pipefail
          series_list="${PPA_SERIES:-stonking,resolute,noble}"
          IFS=',' read -r -a series_array <<< "${series_list}"

          if [[ "${#series_array[@]}" -eq 0 ]]; then
            echo "No PPA series configured" >&2
            exit 1
          fi

          for series in "${series_array[@]}"; do
            series="${series//[[:space:]]/}"
            if [[ ! "${series}" =~ ^[a-z][a-z0-9]*$ ]]; then
              echo "Invalid PPA series: ${series}" >&2
              exit 1
            fi
          done

          root="${RUNNER_TEMP}/deb"
          artifact="${GITHUB_WORKSPACE}/etcd-terminal-linux-x64-self-contained.tar.gz"
          debian_dir="${GITHUB_WORKSPACE}/packaging/debian"
          rm -rf "${root}"
          mkdir -p "${root}/orig/etcd-terminal-${VERSION}/app" "${GITHUB_WORKSPACE}/dist/deb" "${GITHUB_WORKSPACE}/dist/source"

          # Launchpad requires one identical .orig.tar.gz per upstream version across all series.
          tar xzf "${artifact}" -C "${root}/orig/etcd-terminal-${VERSION}/app"
          orig="${root}/etcd-terminal_${VERSION}.orig.tar.gz"
          tar -C "${root}/orig" --sort=name --owner=0 --group=0 --numeric-owner \
            -cf - "etcd-terminal-${VERSION}" | gzip -n > "${orig}"

          for series in "${series_array[@]}"; do
            series="${series//[[:space:]]/}"
            debversion="${VERSION}-1~ppa1~${series}"
            series_root="${root}/${series}"
            src="${series_root}/etcd-terminal-${VERSION}"

            mkdir -p "${series_root}"
            cp "${orig}" "${series_root}/"
            tar xzf "${orig}" -C "${series_root}"
            cp -r "${debian_dir}" "${src}/debian"

            {
              printf 'etcd-terminal (%s) %s; urgency=medium\n\n' "${debversion}" "${series}"
              printf '  * Release %s.\n\n' "${VERSION}"
              printf ' -- Alexanderius <alexander.krylkov@gmail.com>  %s\n' "$(date -R)"
            } > "${src}/debian/changelog"

            cd "${src}"
            dpkg-buildpackage -S -sa -us -uc
            dpkg-buildpackage -b -us -uc

            cp "${series_root}"/*.deb "${GITHUB_WORKSPACE}/dist/deb/"
            mkdir -p "${GITHUB_WORKSPACE}/dist/source/${series}"
            cp "${series_root}"/*.dsc "${series_root}"/*.orig.tar.gz "${series_root}"/*.debian.tar.xz \
               "${series_root}"/*_source.changes "${series_root}"/*_source.buildinfo \
               "${GITHUB_WORKSPACE}/dist/source/${series}/"
          done

      - name: Upload .deb
        uses: actions/upload-artifact@v7
        with:
          name: deb-package
          path: dist/deb/*.deb

      - name: Upload Debian source package
        uses: actions/upload-artifact@v7
        with:
          name: deb-source
          path: dist/source/

  ppa:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [debian, release]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Download source package
        uses: actions/download-artifact@v7
        with:
          name: deb-source
          path: source

      - name: Check PPA credentials
        id: ppa-credentials
        env:
          PPA_GPG_PRIVATE_KEY: ${{ secrets.PPA_GPG_PRIVATE_KEY }}
        run: |
          if [[ -n "${PPA_GPG_PRIVATE_KEY}" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "PPA_GPG_PRIVATE_KEY is not configured; skipping PPA upload" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Install signing tools
        if: steps.ppa-credentials.outputs.enabled == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends devscripts dput gnupg gnupg-utils

      - name: Sign and upload to PPA
        if: steps.ppa-credentials.outputs.enabled == 'true'
        env:
          PPA_GPG_PRIVATE_KEY: ${{ secrets.PPA_GPG_PRIVATE_KEY }}
          PPA_GPG_KEY_ID: ${{ secrets.PPA_GPG_KEY_ID }}
          PPA_GPG_PASSPHRASE: ${{ secrets.PPA_GPG_PASSPHRASE }}
          PPA_TARGET: ${{ vars.PPA_TARGET }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "${GNUPGHOME}"
          printf '%s\n' "${PPA_GPG_PRIVATE_KEY}" | gpg --batch --import

          keyid="${PPA_GPG_KEY_ID:-}"
          if [[ -z "${keyid}" ]]; then
            keyid="$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^fpr:/{print $10; exit}')"
          fi
          if [[ -z "${keyid}" ]]; then
            echo "No PPA signing key found" >&2
            exit 1
          fi

          if [[ -n "${PPA_GPG_PASSPHRASE:-}" ]]; then
            printf 'allow-loopback-pinentry\nallow-preset-passphrase\n' > "${GNUPGHOME}/gpg-agent.conf"
            gpg-connect-agent reloadagent /bye >/dev/null

            gpg_preset="$(command -v gpg-preset-passphrase || true)"
            if [[ -z "${gpg_preset}" ]]; then
              for candidate in /usr/lib/gnupg/gpg-preset-passphrase /usr/lib/gnupg2/gpg-preset-passphrase; do
                if [[ -x "${candidate}" ]]; then
                  gpg_preset="${candidate}"
                  break
                fi
              done
            fi
            if [[ -z "${gpg_preset}" ]]; then
              echo "gpg-preset-passphrase not found" >&2
              exit 1
            fi

            mapfile -t keygrips < <(gpg --batch --with-colons --list-secret-keys "${keyid}" | awk -F: '/^grp:/{print $10}')
            if [[ "${#keygrips[@]}" -eq 0 ]]; then
              echo "No keygrip found for ${keyid}" >&2
              exit 1
            fi
            for keygrip in "${keygrips[@]}"; do
              printf '%s\n' "${PPA_GPG_PASSPHRASE}" | "${gpg_preset}" --homedir "${GNUPGHOME}" --preset "${keygrip}"
            done
          fi

          target="${PPA_TARGET:-ppa:simplifynet/etcd-terminal}"
          found=false
          for dir in source/*/; do
            [[ -d "${dir}" ]] || continue

            changes="$(find "${dir}" -maxdepth 1 -name '*_source.changes' -print -quit)"
            if [[ -z "${changes}" ]]; then
              echo "No source .changes file found in ${dir}" >&2
              exit 1
            fi

            echo "Uploading $(basename "${dir}") to ${target}"
            debsign -k "${keyid}" "${changes}"
            dput "${target}" "${changes}"
            found=true
          done
          if [[ "${found}" != true ]]; then
            echo "No source packages found" >&2
            exit 1
          fi

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, arch, debian]
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: artifacts

      - name: Download Arch package
        uses: actions/download-artifact@v7
        with:
          name: arch-package

      - name: Download .deb
        uses: actions/download-artifact@v7
        with:
          name: deb-package

      - name: Extract changelog entry
        run: |
          awk '/^## \[/{if(f) exit; f=1; next} f' \
            src/EtcdTerminal.App/CHANGELOG.md \
            > /tmp/release_notes.md

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file /tmp/release_notes.md \
            etcd-terminal-linux-x64.tar.gz \
            etcd-terminal-win-x64.zip \
            etcd-terminal-linux-x64-self-contained.tar.gz \
            etcd-terminal-win-x64-self-contained.zip \
            *.pkg.tar.zst \
            *.deb

  aur:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, arch, release]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check AUR credentials
        id: aur-credentials
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [[ -n "${AUR_SSH_PRIVATE_KEY}" ]]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "AUR_SSH_PRIVATE_KEY is not configured; skipping AUR push" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Download artifacts
        if: steps.aur-credentials.outputs.enabled == 'true'
        uses: actions/download-artifact@v7
        with:
          name: artifacts

      - name: Prepare AUR files
        if: steps.aur-credentials.outputs.enabled == 'true'
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${VERSION#v}"
          if [[ ! "${version}" =~ ^[0-9][A-Za-z0-9._+]*$ ]]; then
            echo "Invalid package version: ${version}" >&2
            exit 1
          fi

          sha256="$(sha256sum etcd-terminal-linux-x64-self-contained.tar.gz | cut -d' ' -f1)"

          mkdir -p aur
          sed -e "s/^_tag=.*/_tag=${VERSION}/" \
              -e "s/^pkgver=.*/pkgver=${version}/" \
              -e "s/^sha256sums=.*/sha256sums=('${sha256}')/" \
              packaging/arch/PKGBUILD > aur/PKGBUILD

          docker run --rm \
            -v "${GITHUB_WORKSPACE}/aur:/aur" \
            archlinux:latest \
            bash -c '
              set -euo pipefail
              pacman -Sy --noconfirm archlinux-keyring >/dev/null
              pacman -Syu --noconfirm --needed base-devel >/dev/null
              useradd -m builder

              mkdir -p /tmp/aur
              cp /aur/PKGBUILD /tmp/aur/
              chown -R builder:builder /tmp/aur
              su - builder -c "cd /tmp/aur && makepkg --printsrcinfo"
            ' > aur/.SRCINFO

      - name: Push to AUR
        if: steps.aur-credentials.outputs.enabled == 'true'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${AUR_SSH_PRIVATE_KEY}" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null

          export GIT_SSH_COMMAND="ssh -i ${HOME}/.ssh/aur -o IdentitiesOnly=yes"

          rm -rf /tmp/aur-repo
          if ! git -c init.defaultBranch=master clone ssh://aur@aur.archlinux.org/etcd-terminal-bin.git /tmp/aur-repo; then
            rm -rf /tmp/aur-repo
            git -c init.defaultBranch=master init /tmp/aur-repo
            git -C /tmp/aur-repo remote add origin ssh://aur@aur.archlinux.org/etcd-terminal-bin.git
          fi

          cp aur/PKGBUILD aur/.SRCINFO /tmp/aur-repo/
          git -C /tmp/aur-repo config user.name "github-actions[bot]"
          git -C /tmp/aur-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/aur-repo add PKGBUILD .SRCINFO

          if git -C /tmp/aur-repo diff --cached --quiet; then
            echo "AUR package is already up to date"
          else
            git -C /tmp/aur-repo commit -m "Update to ${VERSION#v}"
            git -C /tmp/aur-repo push origin master
          fi
